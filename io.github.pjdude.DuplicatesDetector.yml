app-id: io.github.pjdude.DuplicatesDetector
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: dude

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

  - --device=all

  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --filesystem=home

  - --persist=.dude

modules:
  - name: python3-numpy
    buildsystem: simple
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/ed/a7/2bcd3fdbb87804755c35b729bf8709d62025c5f4cfd7d5b2415997097515/numpy-2.5.1-cp313-cp313-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
        sha256: 9726558e8db4a5bf7929a70ae50f63abda4daf0efe810e3bfbab95976f75fc1a
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} numpy==2.5.1

  - name: python3-pillow
    buildsystem: simple
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/f7/62/de5bdd77d935331f4f802edc11e4d82950f642caad6cb2f949837b8560e2/pillow-12.3.0-cp313-cp313-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
        sha256: 0847a763afefb695bc912d7c131e7e0632d4edc1d8698f58ddabec8e46b8b6d3
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} pillow==12.3.0

  - name: python3-psutil
    buildsystem: simple
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/b5/70/5d8df3b09e25bce090399cf48e452d25c935ab72dad19406c77f4e828045/psutil-7.2.2-cp36-abi3-manylinux2010_x86_64.manylinux_2_12_x86_64.manylinux_2_28_x86_64.whl
        sha256: 076a2d2f923fd4821644f5ba89f059523da90dc9014e85f8e45a5774ca5bc6f9
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} numpy==2.5.1

  - name: dude
    buildsystem: simple
    build-commands:
      - echo stage_00
      - mkdir -p /app/share/dude
      - echo stage_01
      - install -Dm755 dude.sh /app/bin/dude
      - echo stage_02
      - cp -v src/dude.py /app/share/dude/dude.py
      - echo stage_03
      - cp -v src/version.txt /app/share/dude/version.txt
      - echo stage_04
      - echo "Flatpak Build" > /app/share/dude/distro.info.txt
      - echo stage_05
      - cp -v src/images.py /app/share/dude/images.py
      - echo stage_06

      - install -Dm644 src/icons/dude.png                                   /app/share/icons/hicolor/256x256/apps/io.github.pjdude.DuplicatesDetector.png
      - echo stage_07
      - install -Dm644 io.github.pjdude.DuplicatesDetector.desktop          /app/share/applications/io.github.pjdude.DuplicatesDetector.desktop
      - echo stage_08
      - install -Dm644 io.github.pjdude.DuplicatesDetector.metainfo.xml     /app/share/metainfo/io.github.pjdude.DuplicatesDetector.metainfo.xml
      - echo stage_09

    sources:
       - type: file
         path: dude.sh
       - type: file
         path: io.github.pjdude.DuplicatesDetector.desktop
       - type: file
         path: io.github.pjdude.DuplicatesDetector.metainfo.xml
       - type: file
         path: src/images.py
         dest: src
       - type: file
         path: src/dude.py
         dest: src
       - type: file
         path: src/version.txt
         dest: src
       - type: file
         path: src/icons/dude.png
         dest: src/icons
