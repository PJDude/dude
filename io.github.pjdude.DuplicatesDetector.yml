app-id: io.github.pjdude.DuplicatesDetector
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: dude

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

  - --device=all

  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --filesystem=home

  - --persist=.dude

modules:
